name: Fork CI - NamespaceFileControllerTest

on:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@f2a43e47294d4d0bbc888e3f76ef1007d266e3ba # v5.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run NamespaceFileControllerTest
        run: ./gradlew :webserver:test --tests 'io.kestra.webserver.controllers.api.NamespaceFileControllerTest' --no-daemon
