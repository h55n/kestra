name: Fork CI - NamespaceFileControllerTest

on:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run NamespaceFileControllerTest
        run: ./gradlew :webserver:test --tests 'io.kestra.webserver.controllers.api.NamespaceFileControllerTest' --no-daemon
